<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INNOVEXA STUDIOS — We build software that moves businesses forward.</title>
    <meta
      name="description"
      content="INNOVEXA STUDIOS is a founder-led software studio building websites, applications, automation systems and digital products for ambitious businesses."
    />
    <meta name="theme-color" content="#0B0D17" />

    <!-- Open Graph / social preview -->
    <!-- og:image and og:url use relative/placeholder values for local dev.
         Once deployed, replace with absolute URLs (e.g. https://innovexa.studio/...)
         — social crawlers (Facebook, LinkedIn, Twitter/X) won't resolve relative paths. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="INNOVEXA STUDIOS" />
    <meta property="og:url" content="https://innovexa.studio/" />
    <meta property="og:title" content="INNOVEXA STUDIOS — We build software that moves businesses forward." />
    <meta
      property="og:description"
      content="INNOVEXA STUDIOS is a founder-led software studio building websites, applications, automation systems and digital products for ambitious businesses."
    />
    <meta property="og:image" content="/logo-full.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="INNOVEXA STUDIOS — We build software that moves businesses forward." />
    <meta
      name="twitter:description"
      content="INNOVEXA STUDIOS is a founder-led software studio building websites, applications, automation systems and digital products for ambitious businesses."
    />
    <meta name="twitter:image" content="/logo-full.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
